<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WaitForIt: tell an AI agent what you want and the most you'll pay. It watches prices and buys with a PayPal hold when the price is right." />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <title>WaitForIt</title>
  </head>
  <body>
    <!-- Opening screen: shows at once (plain HTML/CSS) while the app loads and the API wakes up. -->
    <div id="splash" role="status" aria-live="polite">
      <style>
        #splash {
          --s-bg: #f4f7f6; --s-text: #10201e; --s-muted: #5b6b68; --s-brand: #0f766e; --s-track: #dce6e4; --s-card: #ffffff; --s-old: #8a9794;
          position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--s-bg);
          font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--s-text);
          transition: opacity .5s ease, visibility .5s;
        }
        @media (prefers-color-scheme: dark) {
          :root:not([data-theme='light']) #splash { --s-bg: #0b1514; --s-text: #e3eeec; --s-muted: #93a6a2; --s-brand: #2dd4bf; --s-track: #1f3330; --s-card: #12201e; --s-old: #6f817d; }
        }
        :root[data-theme='dark'] #splash { --s-bg: #0b1514; --s-text: #e3eeec; --s-muted: #93a6a2; --s-brand: #2dd4bf; --s-track: #1f3330; --s-card: #12201e; --s-old: #6f817d; }
        #splash.done { opacity: 0; visibility: hidden; }
        #splash .stage { display: grid; justify-items: center; gap: 20px; padding: 0 24px; text-align: center; }
        #splash .scene { position: relative; width: 220px; height: 150px; }
        #splash .string { position: absolute; left: 50%; top: 0; width: 2px; height: 34px; background: var(--s-muted); opacity: .5; transform: translateX(-50%); }
        #splash .tag {
          position: absolute; left: 50%; top: 30px; width: 150px; height: 92px; margin-left: -75px;
          transform-origin: 50% -26px; animation: s-swing 1.6s cubic-bezier(.3, 1.4, .5, 1) both;
        }
        #splash .tag svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
        #splash .tag .shape { fill: var(--s-card); stroke: var(--s-track); stroke-width: 2; filter: drop-shadow(0 8px 18px rgba(16, 32, 30, .14)); }
        #splash .tag .hole { fill: var(--s-bg); stroke: var(--s-track); stroke-width: 2; }
        #splash .old, #splash .new { position: absolute; left: 34px; right: 10px; font: 700 30px/1 'Space Grotesk', Inter, sans-serif; }
        #splash .old { top: 18px; color: var(--s-old); }
        #splash .old::after { content: ''; position: absolute; left: -4px; top: 50%; height: 3px; width: 0; background: #b91c1c; border-radius: 2px; animation: s-strike .35s 1.1s ease-out forwards; }
        #splash .new { top: 52px; color: var(--s-brand); opacity: 0; transform: translateY(-14px); animation: s-drop .5s 1.45s cubic-bezier(.3, 1.6, .5, 1) forwards; font-size: 26px; }
        #splash .ok { position: absolute; right: 18px; bottom: 6px; width: 34px; height: 34px; opacity: 0; transform: scale(.4); animation: s-pop .45s 1.9s cubic-bezier(.3, 1.6, .5, 1) forwards; }
        #splash h1 { margin: 0; font: 700 28px/1.2 'Space Grotesk', Inter, sans-serif; letter-spacing: -.01em; opacity: 0; animation: s-up .6s .5s forwards; }
        #splash p { margin: 0; color: var(--s-muted); font-size: 15px; opacity: 0; animation: s-up .6s .7s forwards; }
        #splash .wake { min-height: 44px; display: grid; gap: 10px; justify-items: center; opacity: 0; transition: opacity .4s; }
        #splash.waiting .wake { opacity: 1; }
        #splash .bar { width: 180px; height: 4px; border-radius: 2px; background: var(--s-track); overflow: hidden; }
        #splash .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--s-brand); animation: s-slide 1.3s ease-in-out infinite; }
        #splash .wake span { font-size: 13px; color: var(--s-muted); }
        @keyframes s-swing { 0% { transform: rotate(-24deg); opacity: 0; } 15% { opacity: 1; } 45% { transform: rotate(12deg); } 70% { transform: rotate(-5deg); } 100% { transform: rotate(0); opacity: 1; } }
        @keyframes s-strike { to { width: calc(100% - 20px); } }
        @keyframes s-drop { to { opacity: 1; transform: none; } }
        @keyframes s-pop { to { opacity: 1; transform: none; } }
        @keyframes s-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes s-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-reduced-motion: reduce) { #splash *, #splash *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; } }
      </style>
      <div class="stage">
        <div class="scene" aria-hidden="true">
          <div class="string"></div>
          <div class="tag">
            <svg viewBox="0 0 150 92"><path class="shape" d="M26 0h114a10 10 0 0 1 10 10v72a10 10 0 0 1-10 10H26L0 46z" /><circle class="hole" cx="20" cy="46" r="6" /></svg>
            <div class="old">$179</div>
            <div class="new">$129</div>
            <svg class="ok" viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#15803d" /><path d="M10 17.5l4.5 4.5L24 12.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </div>
        </div>
        <h1>WaitForIt</h1>
        <p>Waiting for the right price…</p>
        <div class="wake"><div class="bar"></div><span id="splash-note">Waking up the free server. This can take up to a minute.</span></div>
      </div>
    </div>
    <script>
      try { var t = localStorage.getItem('waitforit.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
